[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
kamino_tester = "5JmAnBvF8akh9N36bqoxZdAsyv4SeW6oNedJpj3WUSoT"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
# wallet = "~/.config/solana/id.json"
wallet = ".secrets/depxPDoQBS9JXgwVumiJeuaaSU9b8FaCRwEVTaGD1v9.json"


[scripts]
test = "yarn ts-mocha -p ./tsconfig.json -t 1000000 tests/e2e.ts"

# ---------------------------------------------------------------------------
# Test validator: cloned mainnet KLend state + synthetic test-wallet USDC.
# ---------------------------------------------------------------------------
[test]
startup_wait = 50000
[test.validator]
# Start the local validator at (near) the slot at which KLend state was dumped.
# Keeps `reserve.last_update.slot` and oracle timestamps within KLend's age checks.
# Regenerate the number in fixtures/klend/slot.txt via `yarn dump-klend`.
warp_slot = 413424802

[[test.genesis]]
address = "KLend2g3cP87fffoy8q1mQqGKjrxjC8boSyAYavgmjD"
program = "so/klend.so"
upgradeable = true

